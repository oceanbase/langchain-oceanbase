[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "langchain-oceanbase"
version = "0.6.2"
description = "An integration package connecting OceanBase and LangChain"
authors = ["shanhaikang.shk <shanhaikang.shk@oceanbase.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "langchain_oceanbase"}]
include = ["langchain_oceanbase/py.typed"]

[tool.mypy]
disallow_untyped_defs = "True"

[tool.poetry.urls]
"Source Code" = "https://github.com/langchain-ai/langchain/tree/master/libs/partners/oceanbase"
"Release Notes" = "https://github.com/oceanbase/langchain-oceanbase/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Floors raised for 0.6.0: copy_thread/delete_for_runs/prune are langgraph-checkpoint
# 4.x base capabilities (validated working on checkpoint 4.0.0), so the floor must
# guarantee a 4.x-capable stack. langgraph 1.0.6 is the first release that *allows*
# langgraph-checkpoint 4.x (earlier langgraph caps it <4.0.0), so a langgraph floor
# raise is unavoidable; langchain-core >=1.0 keeps the "0.6.x = LangChain 1.x" story
# while still admitting LangChain 1.0/1.1 users. CI tests both this floor and the
# locked newest stack.
langchain-core = ">=1.0.0,<2.0.0"
langgraph = ">=1.0.6,<2.0.0"
langgraph-checkpoint = ">=4.0.0,<5.0.0"
# >=1.4.0.post1: latest unified seekdb client in the 1.4.0 release line.
pyseekdb = { version = ">=1.4.0.post1,<3", optional = true }
# >=1.4.0: align the native embedded runtime with pyseekdb 1.4.0 while retaining
# Unix-socket support for async drivers (oceanbase/langchain-oceanbase#151).
pylibseekdb = { version = ">=1.4.0,<2", optional = true, markers = "sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')" }
pyobvector = [
    { version = ">=0.2.29" },
    { version = ">=0.2.29", extras = ["pyseekdb"], markers = "extra == 'pyseekdb'" },
]
# Pin to safe version for security (CVE-2025-69228 etc.); direct dep so Dependabot can update
aiohttp = ">=3.13.3"

[tool.poetry.extras]
pyseekdb = ["pyseekdb", "pylibseekdb"]

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]
ignore = ["E501"]  # Allow long lines in docstrings

[tool.ruff.lint.per-file-ignores]
# Allow print statements in test files and examples
"tests/**/*.py" = ["T201"]
"examples/**/*.py" = ["T201"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
    "embedded_seekdb: optional integration test for embedded SeekDB (requires pylibseekdb)",
]
asyncio_mode = "auto"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ipykernel = ">=6.29.5,<8.0.0"
pre-commit = ">=3.7,<5.0"
# Pin to safe version for security (Dependabot security advisory); also makes it a direct dep so Dependabot can update
virtualenv = ">=20.36.1"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.2"
pytest-cov = ">=4.1,<8.0"
pytest-socket = ">=0.7,<0.9"
pytest-watcher = ">=0.3.4,<0.7.0"
langgraph-checkpoint-conformance = ">=0.0.2,<0.1.0"
langchain-tests = "==1.1.6"
langchain-community = ">=0.3.12,<0.5.0"
dashscope = "^1.20.14"

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.6"

[tool.poetry.group.test_integration.dependencies]

[tool.poetry.group.lint.dependencies]
ruff = ">=0.5,<0.17"

[tool.poetry.group.typing.dependencies]
mypy = ">=1.10,<3.0"
